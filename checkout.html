<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout — LUMÉA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            LUMÉA
        </div>

        <button class="menu-btn" id="menu-btn">
            ☰
        </button>

        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="#">About</a>
            <a href="cart.html">
                Cart 🛒 <span id="cart-count">0</span>
            </a>
        </nav>

    </header>


    <!-- Checkout -->

    <main class="checkout-page">

        <div class="checkout-heading">

            <p class="small-text">LUMÉA CHECKOUT</p>

            <h1>Complete your order</h1>

            <p>
                Almost there. Enter your details to complete
                your skincare order.
            </p>

        </div>


        <div class="checkout-layout">


            <!-- Customer Details -->

            <section class="checkout-form">

                <h2>Delivery details</h2>

                <form id="checkout-form">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your name"
                        required
                    >


                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >


                    <label for="phone">Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Your phone number"
                        required
                    >


                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>


                    <button type="submit" class="checkout-btn">
                        Place Order
                    </button>

                </form>

            </section>


            <!-- Order Summary -->

            <section class="checkout-summary">

                <h2>Your Order</h2>

                <div id="checkout-items">
                </div>

                <div class="checkout-total">

                    <span>Total</span>

                    <strong id="checkout-total">
                        ₹0
                    </strong>

                </div>

            </section>

        </div>

    </main>


    <!-- Success Message -->

    <div id="order-success" class="order-success">

        <div>

            <h2>Order placed! ✨</h2>

            <p>
                Thank you for choosing LUMÉA.
                Your skincare ritual is on its way.
            </p>

            <a href="index.html" class="hero-button">
                Back to Home
            </a>

        </div>

    </div>


    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
